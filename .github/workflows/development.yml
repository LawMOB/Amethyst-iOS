name: Development build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Development build

    runs-on: macos-latest

    steps:
      - name: Install dependencies
        run: |
          brew install temurin@8 ldid make

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Checkout repository submodules
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git lfs install --skip-smudge
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"

          git submodule sync --recursive
          # Force a deep, targeted initialization of the MobileGL tree to catch nested SPIR-V tools
          git submodule update --init --recursive --force Natives/external/MobileGL
          
      - name: Debug MobileGL
        run: |
          cd Natives/external/MobileGL

          echo "=== git status ==="
          git status

          echo "=== submodules ==="
          git submodule status --recursive

          echo "=== 3rdparty ==="
          ls -la 3rdparty || true

          echo "=== glslang ==="
          ls -la 3rdparty/glslang || true

          echo "=== SPIRV-Cross ==="
          ls -la 3rdparty/SPIRV-Cross || true

          echo "=== Vulkan-Headers ==="
          ls -la 3rdparty/Vulkan-Headers || true

          echo "=== SPIRV-Reflect ==="
          ls -la 3rdparty/SPIRV-Reflect || true

      - name: Build
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export SLIMMED=1

          gmake -j$(sysctl -n hw.ncpu) package
          gmake -j$(sysctl -n hw.ncpu) package TROLLSTORE_JIT_ENT=1

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst.ipa
          path: artifacts/org.angelauramc.amethyst-*.ipa

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-TrollStore.tipa
          path: artifacts/org.angelauramc.amethyst-*-trollstore.tipa

      - name: Upload jre
        uses: actions/upload-artifact@v4
        with:
          name: java_runtimes
          path: artifacts/java_runtimes/*
